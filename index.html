<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pecha Page Aligner</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697386;--border:#e1e6ef;--primary:#315efb;--primary2:#2449c9;--success:#16834b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#f7f9fc,#eef2f7)}
.wrap{max-width:1050px;margin:auto;padding:28px 16px 50px}header{text-align:center;margin-bottom:24px}
.logo{width:54px;height:54px;margin:0 auto 12px;border-radius:15px;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:25px;font-weight:800}
h1{font-size:30px;margin:0 0 7px}.tagline{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 8px 28px rgba(20,35,60,.07);margin-bottom:18px}
.upload{display:block;border:2px dashed #b9c3d4;border-radius:13px;padding:30px 18px;text-align:center;cursor:pointer;background:#fbfcfe}
.upload:hover{border-color:var(--primary);background:#f7f9ff}input[type=file]{display:none}
.upload-title{font-weight:700;font-size:17px}.upload-file{display:block;margin-top:6px;color:var(--muted);font-size:14px;word-break:break-word}
.controls{margin-top:18px}.label{font-size:14px;font-weight:700;margin-bottom:9px;display:block}
.parts{display:flex;gap:10px}.part{background:#edf0f5;color:#263142;flex:1;border:0;border-radius:10px;padding:11px 17px;font-size:15px;font-weight:650;cursor:pointer}
.part.active{background:var(--primary);color:#fff}.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1;border:0;border-radius:10px;padding:11px 17px;font-size:15px;font-weight:650;cursor:pointer}
.primary{background:var(--primary);color:#fff}.success{background:var(--success);color:#fff}
button:disabled{opacity:.48;cursor:not-allowed}.status{min-height:22px;margin-top:13px;font-size:14px;color:var(--muted)}
.status.ok{color:var(--success)}.status.error{color:#c43b3b}.note,.order{font-size:13px;line-height:1.5;color:var(--muted)}
.note{margin:13px 0 0}.hidden{display:none}.preview-head h2{font-size:21px;margin:0}.order{margin-top:8px;word-break:break-word}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;margin-top:17px}
.page{border:1px solid var(--border);border-radius:12px;background:#fff;padding:8px;text-align:center}
.page img{width:100%;height:180px;object-fit:contain;background:#f0f2f5;border-radius:7px}.new{font-weight:750;font-size:14px;margin-top:8px}.original{font-size:12px;color:var(--muted);margin-top:3px}
footer{text-align:center;color:#8a94a6;font-size:12px;margin-top:22px}
@media(max-width:600px){.wrap{padding:20px 10px 40px}h1{font-size:25px}.card{padding:15px}.actions{flex-direction:column}.preview{grid-template-columns:repeat(2,minmax(0,1fr))}.page img{height:165px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">P</div><h1>Pecha Page Aligner</h1><p class="tagline">Arrange PDF pages into 2 or 3 aligned parts</p></header>
<section class="card">
<label class="upload" for="pdfInput"><span class="upload-title">Choose PDF</span><span id="fileName" class="upload-file">Select a PDF from your computer</span></label>
<input id="pdfInput" type="file" accept="application/pdf,.pdf">
<div id="controls" class="controls hidden">
<span class="label">Choose alignment</span>
<div class="parts"><button id="twoBtn" class="part">2 Parts</button><button id="threeBtn" class="part">3 Parts</button></div>
<div class="actions"><button id="previewBtn" class="primary">Preview Alignment</button><button id="downloadBtn" class="success" disabled>Download PDF</button></div>
<div id="status" class="status"></div>
<p class="note">Pages are divided consecutively. If the total cannot be divided equally, the extra pages go to the last part. The parts are then aligned page-by-page.</p>
</div>
</section>
<section id="previewCard" class="card hidden"><div class="preview-head"><h2>Preview</h2></div><div id="orderText" class="order"></div><div id="preview" class="preview"></div></section>
<footer>Pecha Page Aligner • Simple PDF page ordering</footer>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const input=document.getElementById("pdfInput"),fileName=document.getElementById("fileName"),controls=document.getElementById("controls");
const twoBtn=document.getElementById("twoBtn"),threeBtn=document.getElementById("threeBtn"),previewBtn=document.getElementById("previewBtn");
const downloadBtn=document.getElementById("downloadBtn"),status=document.getElementById("status"),previewCard=document.getElementById("previewCard");
const preview=document.getElementById("preview"),orderText=document.getElementById("orderText");
let file=null,pdfDoc=null,parts=2,reordered=[];

function setStatus(text,type=""){status.textContent=text;status.className="status "+type}
function setParts(n){parts=n;twoBtn.classList.toggle("active",n===2);threeBtn.classList.toggle("active",n===3);downloadBtn.disabled=true;previewCard.classList.add("hidden")}
twoBtn.onclick=()=>setParts(2);threeBtn.onclick=()=>setParts(3);

input.onchange=async()=>{
file=input.files[0];if(!file)return;fileName.textContent=file.name;controls.classList.remove("hidden");setParts(2);setStatus("Loading PDF...");
try{const data=new Uint8Array(await file.arrayBuffer());pdfDoc=await pdfjsLib.getDocument({data}).promise;setStatus(`${pdfDoc.numPages} pages loaded. Choose 2 Parts or 3 Parts.`,"ok")}
catch(e){console.error(e);pdfDoc=null;setStatus("Could not read this PDF. Please choose another PDF.","error")}
};

function buildOrder(total,count){
const base=Math.floor(total/count),sizes=Array(count).fill(base);sizes[count-1]+=total%count;const groups=[];let start=0;
for(const size of sizes){groups.push(Array.from({length:size},(_,i)=>start+i));start+=size}
const result=[],maxLen=Math.max(...groups.map(g=>g.length));
for(let i=0;i<maxLen;i++)for(const group of groups)if(i<group.length)result.push(group[i]);
return result;
}
async function renderPage(index){
const page=await pdfDoc.getPage(index+1),viewport=page.getViewport({scale:.65}),canvas=document.createElement("canvas");
canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
return canvas.toDataURL("image/jpeg",.82);
}
previewBtn.onclick=async()=>{
if(!pdfDoc)return;previewBtn.disabled=true;downloadBtn.disabled=true;setStatus("Creating preview...");
try{
reordered=buildOrder(pdfDoc.numPages,parts);orderText.textContent="New page order: "+reordered.map(i=>i+1).join(" → ");preview.innerHTML="";
for(let i=0;i<reordered.length;i++){const original=reordered[i],src=await renderPage(original),card=document.createElement("div");card.className="page";
card.innerHTML=`<img src="${src}" alt="Original page ${original+1}"><div class="new">New Page ${i+1}</div><div class="original">Original Page ${original+1}</div>`;preview.appendChild(card)}
previewCard.classList.remove("hidden");downloadBtn.disabled=false;setStatus(`Preview ready — ${parts} parts aligned.`,"ok")
}catch(e){console.error(e);setStatus("Could not create the preview.","error")}finally{previewBtn.disabled=false}
};
downloadBtn.onclick=async()=>{
if(!file||!reordered.length)return;downloadBtn.disabled=true;setStatus("Creating your reordered PDF...");
try{
const bytes=new Uint8Array(await file.arrayBuffer()),source=await PDFLib.PDFDocument.load(bytes),output=await PDFLib.PDFDocument.create();
const pages=await output.copyPages(source,reordered);pages.forEach(p=>output.addPage(p));const outBytes=await output.save();
const url=URL.createObjectURL(new Blob([outBytes],{type:"application/pdf"})),a=document.createElement("a");a.href=url;a.download="Pecha-Page-Aligned.pdf";
document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);setStatus("PDF downloaded successfully.","ok")
}catch(e){console.error(e);setStatus("Could not create the reordered PDF.","error")}finally{downloadBtn.disabled=false}
};
</script>
</body>
</html>
